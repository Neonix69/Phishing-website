<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #737070;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: #ede9e9;
            border-radius: 12px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #d5caca;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 13px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            color: rgb(244, 241, 241);
            background-color: #519fff;
            cursor: pointer;
        }

        #message {
            text-align: center;
            color: rgb(229, 231, 234);
            margin-top: 15px;
        }
    </style>
</head>

<body>

        <h1 style="color: rgb(0, 0, 0);">Instagram</h1>

</body>

</html>
